
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleStore | Clothing Store</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation bar -->
    <header>
        <nav class="navbar">
            <a href="/" class="logo">StyleStore</a>

            <div class="nav-links">
                <a href="#products">Products</a>
                <a href="#categories">Categories</a>
                <button id="loginButton" class="nav-button">
                    Login
                </button>
                <button id="cartButton" class="nav-button">
                    Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </nav>
    </header>

    <!-- Main introduction -->
    <section class="hero">
        <div>
            <p class="subtitle">NEW COLLECTION</p>
            <h1>Find Your Style</h1>
            <p>
                Discover clothing that matches your personality.
                Explore our latest collection.
            </p>

            <a href="#products" class="primary-button">
                Shop Now
            </a>
        </div>
    </section>

    <!-- Categories -->
    <section id="categories" class="section">
        <h2>Shop by Category</h2>
        <div id="categoryList" class="category-list">
            <!-- Categories will be loaded from the API -->
        </div>
    </section>

    <!-- Products -->
    <section id="products" class="section">
        <h2>Our Products</h2>

        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <button id="searchButton">Search</button>
        </div>

        <div id="productList" class="product-grid">
            <!-- Products will be loaded from the API -->
        </div>
    </section>

    <!-- Login form -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-button" id="closeLogin">&times;</button>

            <h2>Login</h2>

            <form id="loginForm">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="primary-button">
                    Login
                </button>
            </form>

            <p id="loginMessage"></p>
        </div>
    </div>

    <!-- Shopping cart -->
    <section id="cartSection" class="section hidden">
        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3>Total: $<span id="cartTotal">0.00</span></h3>

        <button id="checkoutButton" class="primary-button">
            Place Order
        </button>

        <p id="orderMessage"></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 StyleStore. All rights reserved.</p>
    </footer>

    <!-- Connect our JavaScript file -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
